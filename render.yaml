# Render blueprint for the MAMS API.
#
# Reproducible from a fresh checkout: the Render dashboard reads this file,
# creates the database and the web service, and wires them together.
#
# Every secret is supplied through Render's environment variable store. No
# credential appears in this file, and nothing here bypasses migrations,
# authentication, authorization or the inventory transaction layer.
#
# Validated against Render's published JSON schema
# (https://render.com/schema/render.yaml.json). The schema sets
# `unevaluatedProperties`, so a key Render does not recognise fails the whole
# file rather than being ignored.
services:
  - type: web
    name: mams-api
    runtime: node
    rootDir: backend
    plan: free
    region: singapore

    # Prisma CLI is a devDependency, so the full dependency tree is installed.
    # `migrate deploy` needs it, and pruning devDependencies would remove it
    # before the start command runs.
    buildCommand: npm ci && npm run prisma:generate

    # Migrations run here rather than in `preDeployCommand`, which Render
    # restricts to paid plans. `migrate deploy` is idempotent: with no pending
    # migrations it exits immediately, so a restart or a scale-up is safe, and
    # `&&` guarantees the server only starts once the schema is current.
    #
    # An earlier version of this file used `preStartCommand`. Render has no such
    # field -- only `buildCommand`, `preDeployCommand` and `startCommand` -- so
    # the blueprint was rejected at review.
    startCommand: npx prisma migrate deploy && node src/server.js

    # Runs once, after the first successful deploy, so the deployed system is
    # not an empty shell: `seed` creates the bases, equipment types, the six
    # demo accounts and the opening balances. It writes straight to the
    # database and reads no environment variables.
    #
    # `seed:demo-activity` is deliberately NOT chained here. It drives the
    # public API over HTTP against a hardcoded http://localhost:5000, and
    # Render serves on $PORT (10000 by default), so it would fail. Run it
    # manually against the deployed URL if movement history is wanted.
    initialDeployHook: npm run seed

    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: mams-db
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 15m

      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      # Set this in the Render dashboard to the deployed frontend origin, for
      # example https://mams-frontend.vercel.app. It is left unsynced because
      # only the real deployment URL is a valid value, and that URL does not
      # exist until the frontend is deployed.
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: mams-db
    plan: free
    region: singapore
    databaseName: mams
    user: mams_user
